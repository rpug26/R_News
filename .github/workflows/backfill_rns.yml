name: Backfill RNS News Log

on:
  workflow_dispatch:
    inputs:
      limit_tickers:
        description: "Max tickers to process (empty = all)"
        required: false
        default: "30"
      offset:
        description: "Skip first N tickers (resume)"
        required: false
        default: "0"
      per_ticker:
        description: "RNS per ticker"
        required: false
        default: "3"

concurrency:
  group: rns-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backfill
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_TICKERS_DB_ID: ${{ secrets.NOTION_TICKERS_DB_ID }}
          NOTION_RNS_DB_ID: ${{ secrets.NOTION_RNS_DB_ID }}
          BACKFILL_LIMIT_TICKERS: ${{ github.event.inputs.limit_tickers }}
          BACKFILL_OFFSET: ${{ github.event.inputs.offset }}
          BACKFILL_PER_TICKER: ${{ github.event.inputs.per_ticker }}
          PYTHONUNBUFFERED: "1"
        run: python backfill_rns.py
