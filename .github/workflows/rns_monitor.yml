name: RNS Alert Bot (manual backup)

# PRIMARY RUNNER = Railway (worker.py loop).
# This workflow is MANUAL ONLY so it does not double-post alerts.
# Do not enable schedule while Railway is running.

on:
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-rns]
  # DISABLED – Railway is the primary scanner
  # schedule:
  #   - cron: '*/15 7-16 * * 1-5'

concurrency:
  group: rns-monitor
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scripts
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          COMMAND_CHAT_ID: ${{ secrets.COMMAND_CHAT_ID }}
          NOTIFICATION_CHAT_ID: ${{ secrets.NOTIFICATION_CHAT_ID }}
          LOG_CHAT_ID: ${{ secrets.LOG_CHAT_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_TICKERS_DB_ID: ${{ secrets.NOTION_TICKERS_DB_ID }}
          NOTION_WATCHLIST_DB_ID: ${{ secrets.NOTION_WATCHLIST_DB_ID }}
          NOTION_RNS_DB_ID: ${{ secrets.NOTION_RNS_DB_ID }}
          PYTHONUNBUFFERED: "1"
        run: |
          python commands.py

          git add tickers.txt || true
          git pull --rebase --autostash origin main

          python bot.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git pull --rebase --autostash origin main

          [ -f last_rns_ids.txt ] && git add last_rns_ids.txt

          if ! git diff --cached --quiet; then
            git commit -m "Update last seen RNS IDs [skip ci]"
            git push origin main
          else
            echo "No changes to commit."
          fi
